[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plainml"
dynamic = ["version"]
description = "Machine learning in plain English: from a spreadsheet to a trained, explained, deployable model in one command."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Pranay Obla" }]
keywords = ["machine learning", "automl", "cli", "scikit-learn", "no-code", "explainable ai", "tabular data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "joblib>=1.3",
    "numpy>=1.24",
    "openpyxl>=3.1",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "questionary>=2.0",
    "rich>=13.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
boost = ["xgboost>=2.0", "lightgbm>=4.0", "catboost>=1.2"]
tune = ["optuna>=3.4"]
explain = ["shap>=0.44"]
imbalance = ["imbalanced-learn>=0.12"]
serve = ["fastapi>=0.110", "uvicorn>=0.27"]
onnx = ["skl2onnx>=1.16", "onnxruntime>=1.17"]
ui = ["streamlit>=1.32"]
formats = ["pyarrow>=14", "sqlalchemy>=2.0"]
fast = ["polars>=0.20", "pyarrow>=14"]
# KMedoids clustering. Not in [all]: it has no prebuilt wheels for recent Pythons.
cluster = ["scikit-learn-extra>=0.3"]
all = [
    "plainml[boost,tune,explain,imbalance,serve,onnx,ui,formats,fast]",
]
dev = [
    "httpx>=0.27",
    "mypy>=1.10",
    "pre-commit>=3.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
docs = ["mkdocs-material>=9.5"]

[project.scripts]
plainml = "plainml.cli:main"

[project.urls]
Homepage = "https://github.com/pranay-obla/plainml"
Repository = "https://github.com/pranay-obla/plainml"
Issues = "https://github.com/pranay-obla/plainml/issues"
Changelog = "https://github.com/pranay-obla/plainml/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "plainml.__version__" }

[tool.setuptools.packages.find]
include = ["plainml*"]

[tool.setuptools.package-data]
plainml = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = [
    "E501",    # long lines are handled by the formatter where possible
    "B008",    # click decorators call functions in defaults by design
    "RUF001",  # ambiguous unicode (we print ± and ×)
    "RUF002",
    "RUF003",
    "SIM108",
    "C408",    # dict(a=1) reads better than {"a": 1} for keyword-style options
    "RUF046",  # int(round(x)) is needed for numpy floats
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"plainml/__init__.py" = ["F401"]  # re-exported for type checkers; loaded lazily at runtime

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running end-to-end tests",
    "optional: needs an optional dependency (skipped when missing)",
]
filterwarnings = [
    "ignore::DeprecationWarning:joblib.*",
]

[tool.mypy]
python_version = "3.12"  # numpy's stubs need 3.12 syntax; runtime still supports 3.10
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.coverage.run]
source = ["plainml"]
omit = ["plainml/ui_app.py"]
