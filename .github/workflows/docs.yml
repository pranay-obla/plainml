# Publishes the documentation site to GitHub Pages, as an alternative to Vercel (vercel.json).
# It only runs when started by hand (Actions tab -> Docs -> Run workflow), since the docs are
# hosted on Vercel. To use GitHub Pages instead: Settings -> Pages -> Source: "GitHub Actions",
# then add a `push: branches: [main]` trigger below.

name: Docs

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[docs]"
      - run: python docs/generate_commands.py --check
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
