# Publishes to PyPI when a GitHub release is published, but only after the tests pass.
#
# Uses PyPI Trusted Publishing: PyPI checks that the upload comes from this workflow in this
# repository, so no API token or GitHub secret is needed. One-time setup on pypi.org
# (before the first release: Your account -> Publishing -> "Add a new pending publisher"):
#   PyPI project name: plainml   Owner: pranay-obla   Repository: plainml
#   Workflow name: python-publish.yml   Environment name: pypi
# See RELEASING.md for the whole release procedure.

name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test before publishing
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  build:
    name: Build the package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check the release tag matches the package version
        run: |
          version=$(python -c "import re;print(re.search(r'__version__ = \"(.+?)\"', open('plainml/__init__.py').read()).group(1))")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Release tag $GITHUB_REF_NAME doesn't match plainml.__version__ ($version)"; exit 1
          fi
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    # Add required reviewers to this environment (Settings -> Environments -> pypi) for a
    # final manual approval before anything is published.
    environment:
      name: pypi
      url: https://pypi.org/project/plainml/
    permissions:
      id-token: write # lets PyPI verify that this workflow is the trusted publisher
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
