# Documentation site:  pip install "plainml[docs]" && mkdocs serve
site_name: plainml
site_description: From a spreadsheet to a trained, explained, deployable ML model in one command.
repo_url: https://github.com/pranay-obla/plainml
edit_uri: edit/main/docs/
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/brightness-7, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/brightness-4, name: Light mode }
  features: [content.code.copy, navigation.sections]
nav:
  - Home: index.md
  - Website: website.md
  - Commands: commands.md
  - Python API: python-api.md
  - How it works: how-it-works.md
  - FAQ: faq.md
markdown_extensions:
  - admonition
  - tables
  - pymdownx.superfences
